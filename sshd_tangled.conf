# Tangled knot sshd drop-in.
#
# git push authenticates via the knot: for the `git` user, sshd calls
# `knot keys` as its AuthorizedKeysCommand, which fetches the pushing
# user's registered SSH public keys from the AppView (by their ATProto
# DID) and emits authorized_keys lines whose command= forces the knot's
# git guard.  No knot-local accounts, no passwords.
#
# Host keys are written to the persistent volume by start.sh (a keys
# subdir of $OPENHOST_APP_DATA_DIR) and symlinked here, so a client's
# known_hosts entry survives container restarts and redeploys.

HostKey /etc/ssh/keys/ssh_host_rsa_key
HostKey /etc/ssh/keys/ssh_host_ecdsa_key
HostKey /etc/ssh/keys/ssh_host_ed25519_key

PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers git

Match User git
  AuthorizedKeysCommand /usr/bin/knot keys -output authorized-keys -internal-api http://127.0.0.1:5444 -git-dir /home/git/repositories -log-path /tmp/knotguard.log
  AuthorizedKeysCommandUser nobody
